<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-label="Daniel Pires Francisco: Farmácia, IA em saúde, Educação e Pesquisa">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06141f"/><stop offset="1" stop-color="#0b2b3a"/></linearGradient>
    <linearGradient id="tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient>
  </defs>
  <rect width="960" height="240" rx="18" fill="url(#bg)"/>
  <g stroke="#5eead4" stroke-opacity="0.35" stroke-width="2" fill="none"><path d="M720 60 L790 100 L860 70 M790 100 L800 170 L880 190 M800 170 L730 200"/></g>
  <g fill="#5eead4"><circle cx="720" cy="60" r="8"><animate attributeName="r" values="6;10;6" dur="3s" repeatCount="indefinite"/></circle><circle cx="790" cy="100" r="10"><animate attributeName="r" values="8;12;8" dur="3.6s" repeatCount="indefinite"/></circle><circle cx="860" cy="70" r="7"><animate attributeName="r" values="5;9;5" dur="2.8s" repeatCount="indefinite"/></circle></g>
  <g fill="#a5b4fc"><circle cx="800" cy="170" r="9"><animate attributeName="r" values="7;11;7" dur="3.2s" repeatCount="indefinite"/></circle><circle cx="880" cy="190" r="6"><animate attributeName="r" values="4;8;4" dur="2.6s" repeatCount="indefinite"/></circle><circle cx="730" cy="200" r="7"><animate attributeName="r" values="5;9;5" dur="3.4s" repeatCount="indefinite"/></circle></g>
  <text x="48" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="url(#tx)">Daniel Pires Francisco</text>
  <text x="48" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#cbd5e1">Plataformas de ensino em saúde com inteligência artificial</text>
  <text x="48" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#5eead4" opacity="0">Farmácia<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.217;0.237;1" dur="12s" repeatCount="indefinite"/></text>
  <text x="48" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#5eead4" opacity="0">IA em saúde<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.467;0.487;1" dur="12s" repeatCount="indefinite"/></text>
  <text x="48" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#5eead4" opacity="0">Educação<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.718;0.738;1" dur="12s" repeatCount="indefinite"/></text>
  <text x="48" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#5eead4" opacity="0">Pesquisa<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.77;0.97;0.99;1" dur="12s" repeatCount="indefinite"/></text>
  <text x="48" y="208" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#cbd5e1" fill-opacity="0.8">Presidente da LAIFT · UNINASSAU Salvador</text>
</svg>
